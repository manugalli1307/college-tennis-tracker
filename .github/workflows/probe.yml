name: Probe Challenger sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check the pages
        run: python scraper/probe.py | tee probe.txt
      - name: Save the result
        run: |
          git config user.name "tennis-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p data && mv probe.txt data/probe.txt
          rm -rf data/probe_html && mv probe_html data/probe_html
          git add data/probe.txt data/probe_html
          git commit -m "Probe result $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to save"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
