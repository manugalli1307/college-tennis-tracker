name: Update data and publish site

on:
  schedule:
    - cron: "23 10 * * *"   # about 6:23 AM Eastern: entry lists and last night's results
    - cron: "41 2 * * *"    # about 10:41 PM Eastern: today's results
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect entries and results
        working-directory: scraper
        continue-on-error: true   # if the ITF site is down, keep yesterday's data and still publish
        run: python build_data.py

      - name: Save the new data
        run: |
          git config user.name "tennis-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r data _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
