name: Update data and publish site

on:
  schedule:
    - cron: "7 11 * * *"    # about 6 AM Eastern in winter (7 AM in summer): entry lists and last night's results
    - cron: "7 21 * * *"    # about 4 PM Eastern in winter (5 PM in summer): today's results
    - cron: "7 3 * * 1"      # Sunday about 10 PM Eastern: fresh results for the Last week recap
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["site/**", "scraper/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this run need a fresh scrape?
        id: need
        run: |
          # A push that only changed files under site/ just republishes the saved data (a few minutes).
          # Scheduled runs, manual runs and pushes touching anything else do the full scrape.
          scrape=true
          if [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before" 2>/dev/null; then
              others=$(git diff --name-only "$before" "${{ github.sha }}" | grep -v '^site/' || true)
              if [ -z "$others" ]; then scrape=false; fi
            fi
          fi
          echo "scrape=$scrape" >> "$GITHUB_OUTPUT"
          echo "Fresh scrape needed: $scrape"

      - if: steps.need.outputs.scrape == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper
        if: steps.need.outputs.scrape == 'true'
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect entries and results
        if: steps.need.outputs.scrape == 'true'
        working-directory: scraper
        continue-on-error: true   # if the ITF site is down, keep yesterday's data and still publish
        run: python build_data.py

      - name: Save the new data
        if: steps.need.outputs.scrape == 'true'
        continue-on-error: true   # even if saving fails, the site below is still published with the fresh data
        run: |
          git config user.name "tennis-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git fetch origin main
              # if two runs overlap, the newer data from this run wins
              if git rebase -X theirs origin/main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort || true
              sleep 5
            done
          fi

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r data _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
